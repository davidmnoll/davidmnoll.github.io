<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <rect fill="#1e293b" width="400" height="200"/>

  <!-- QR Code representation (left) -->
  <g transform="translate(30, 30)">
    <rect fill="white" width="60" height="60" rx="4"/>
    <g fill="#1e293b">
      <!-- QR pattern simplified -->
      <rect x="5" y="5" width="15" height="15"/>
      <rect x="40" y="5" width="15" height="15"/>
      <rect x="5" y="40" width="15" height="15"/>
      <rect x="25" y="25" width="10" height="10"/>
      <rect x="45" y="35" width="5" height="5"/>
      <rect x="35" y="45" width="5" height="5"/>
    </g>
  </g>

  <!-- Connection arrows -->
  <g stroke="#22d3ee" stroke-width="2" fill="none">
    <path d="M 100 60 Q 150 40 200 60" marker-end="url(#arrow)"/>
    <path d="M 200 60 Q 150 80 100 60" marker-end="url(#arrow)"/>
  </g>

  <!-- QR Code representation (right) -->
  <g transform="translate(210, 30)">
    <rect fill="white" width="60" height="60" rx="4"/>
    <g fill="#1e293b">
      <rect x="5" y="5" width="15" height="15"/>
      <rect x="40" y="5" width="15" height="15"/>
      <rect x="5" y="40" width="15" height="15"/>
      <rect x="25" y="25" width="10" height="10"/>
      <rect x="15" y="35" width="5" height="5"/>
      <rect x="45" y="45" width="5" height="5"/>
    </g>
  </g>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/>
    </marker>
  </defs>

  <!-- Labels -->
  <text x="60" y="115" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">Device A</text>
  <text x="240" y="115" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">Device B</text>

  <!-- Protocol text -->
  <text x="150" y="145" fill="#22d3ee" font-family="monospace" font-size="10" text-anchor="middle">SYN → SYN+ACK → ACK</text>

  <!-- Lock icon (encryption) -->
  <g transform="translate(310, 40)">
    <rect x="5" y="15" width="30" height="25" rx="3" fill="#22c55e" opacity="0.8"/>
    <path d="M 12 15 V 10 A 8 8 0 0 1 28 10 V 15" stroke="#22c55e" stroke-width="3" fill="none"/>
  </g>
  <text x="325" y="85" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">E2E</text>

  <!-- Title -->
  <text x="200" y="180" fill="white" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">TCP over QR Code</text>
</svg>
